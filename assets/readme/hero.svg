<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="desktop-hero-title desktop-hero-desc">
  <title id="desktop-hero-title">Impetus Desktop — thin macOS client for the Impetus harness</title>
  <desc id="desktop-hero-desc">Transcript UI over Unix-socket IPC. Sessions, policy, and secrets stay in impetusd.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <path d="M48 56H1152M48 304H1152" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Fake app chrome motif: rail + stage -->
  <g transform="translate(720,78)">
    <rect width="400" height="200" rx="14" fill="url(#pane)" stroke="#52525b" stroke-width="1.5"/>
    <rect x="12" y="12" width="88" height="176" rx="8" fill="#09090b" stroke="#3f3f46"/>
    <rect x="28" y="28" width="56" height="10" rx="3" fill="#71717a"/>
    <rect x="28" y="48" width="56" height="8" rx="3" fill="#3f3f46"/>
    <rect x="28" y="64" width="44" height="8" rx="3" fill="#3f3f46"/>
    <rect x="28" y="80" width="50" height="8" rx="3" fill="#3f3f46"/>
    <rect x="112" y="28" width="260" height="12" rx="3" fill="#52525b"/>
    <rect x="112" y="56" width="200" height="8" rx="3" fill="#3f3f46"/>
    <rect x="112" y="72" width="240" height="8" rx="3" fill="#3f3f46"/>
    <rect x="112" y="88" width="160" height="8" rx="3" fill="#3f3f46"/>
    <rect x="112" y="152" width="260" height="36" rx="18" fill="#09090b" stroke="#52525b"/>
    <circle cx="136" cy="170" r="6" fill="#a1a1aa"/>
    <rect x="152" y="164" width="160" height="12" rx="3" fill="#3f3f46"/>
    <circle cx="348" cy="170" r="10" fill="#fafafa"/>
  </g>

  <g fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">
    <text x="52" y="88">THIN SHELL · TAURI + SVELTE</text>
    <text x="52" y="328">UNIX SOCKET IPC · NO SESSION DB · NO KEYCHAIN OWNERSHIP</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="52" y="168" fill="#fafafa" font-size="68" font-weight="700" letter-spacing="-2.5">Impetus Desktop</text>
    <text x="54" y="214" fill="#a1a1aa" font-size="28" font-weight="500">Cursor-quiet transcript UI over a local harness.</text>
    <text x="54" y="250" fill="#71717a" font-size="20">Connect to impetusd. Chat. Approve. Cancel. Leave authority in the daemon.</text>
  </g>
</svg>
