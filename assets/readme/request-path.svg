<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Desktop request path</title>
  <desc id="flow-desc">Impetus Desktop sends typed Tauri commands to a Unix-socket HarnessClient; impetusd owns sessions, events, policy, and secrets.</desc>
  <rect width="1200" height="220" rx="20" fill="#09090b"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="48" y="56" width="240" height="108" rx="14" fill="#18181b" stroke="#3f3f46"/>
    <text x="168" y="100" text-anchor="middle" fill="#fafafa" font-size="22" font-weight="600">Desktop UI</text>
    <text x="168" y="128" text-anchor="middle" fill="#71717a" font-size="15">Tauri · Svelte</text>

    <path d="M304 110H360" stroke="#52525b" stroke-width="2"/>
    <polygon points="360,104 376,110 360,116" fill="#52525b"/>
    <text x="340" y="98" text-anchor="middle" fill="#71717a" font-size="12" font-family="ui-monospace, Menlo, monospace">invoke</text>

    <rect x="392" y="56" width="240" height="108" rx="14" fill="#18181b" stroke="#3f3f46"/>
    <text x="512" y="100" text-anchor="middle" fill="#fafafa" font-size="22" font-weight="600">HarnessClient</text>
    <text x="512" y="128" text-anchor="middle" fill="#71717a" font-size="15">Unix socket IPC</text>

    <path d="M648 110H704" stroke="#52525b" stroke-width="2"/>
    <polygon points="704,104 720,110 704,116" fill="#52525b"/>
    <text x="684" y="98" text-anchor="middle" fill="#71717a" font-size="12" font-family="ui-monospace, Menlo, monospace">v7</text>

    <rect x="736" y="56" width="416" height="108" rx="14" fill="#18181b" stroke="#a1a1aa" stroke-width="1.5"/>
    <text x="944" y="96" text-anchor="middle" fill="#fafafa" font-size="22" font-weight="600">impetusd</text>
    <text x="944" y="124" text-anchor="middle" fill="#a1a1aa" font-size="15">sessions · events · policy · Keychain refs</text>
  </g>
</svg>
