[package]
name = "impetus-desktop"
version = "0.1.0"
description = "Impetus desktop client — thin shell over harness IPC"
authors = ["Local developer"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "impetus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["serde"] }
rfd = "0.15"
# Path relative to src-tauri/ (sibling repo under Documents/projects)
impetus-client = { path = "../../impetus/crates/impetus-client" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.5"
